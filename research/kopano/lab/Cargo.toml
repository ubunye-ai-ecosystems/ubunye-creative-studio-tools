# Kopano research lab. Isolated workspace: experiments and the prototype core.
# Not product code. Build output goes outside the repo (CARGO_TARGET_DIR on T:).
[workspace]
members = ["kopano-core", "kopano-lab"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fastcdc = "3"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
iroh = { version = "1.3", features = ["unstable-net-report"] }
iroh-blobs = "0.103"
kopano-core = { path = "kopano-core" }

[profile.release]
debug = 1
