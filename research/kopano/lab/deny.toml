# Security pass 2026-10-18: licences we can ship under MIT OR Apache-2.0, and known advisories.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0", "0BSD", "Unlicense"]
confidence-threshold = 0.9

[advisories]
# Unmaintained, not vulnerable; all three come in through iroh / iroh-blobs (paste and
# atomic-polyfill only on targets we do not build). Revisit when iroh drops them.
ignore = ["RUSTSEC-2023-0089", "RUSTSEC-2024-0436", "RUSTSEC-2024-0370"]

[bans]
multiple-versions = "allow"
